name: Actualizar precios Airbnb

on:
  schedule:
    - cron: '0 6 1 * *'  # Primer día de cada mes a las 6:00 AM
  workflow_dispatch:       # También permite ejecutarlo manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Ejecutar actualizador de precios
        run: python update_prices.py

      - name: Guardar prices.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Precios actualizados: $(date +'%Y-%m-%d')"
          git push
